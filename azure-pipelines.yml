trigger:
   none

parameters:
  - name: environment
    displayName: 'Terraform Environment'
    type: string
    default: dev
    values:
      - dev
      - prod

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_WORKING_DIR: 'environments/${{ parameters.environment }}'

stages:
  - stage: Validate
    displayName: 'Terraform Validate'
    jobs:
      - job: Validate
        steps:
          - checkout: self
          
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - script: |
              terraform version
              terraform fmt -check -recursive
            displayName: 'Terraform Format Check'

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: 'azure-sp-terraform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd $(TF_WORKING_DIR)
                terraform init

          - task: AzureCLI@2
            displayName: 'Terraform Validate'
            inputs:
              azureSubscription: 'azure-sp-terraform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd $(TF_WORKING_DIR)
                terraform validate

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    jobs:
      - job: Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: 'Terraform Plan'
            inputs:
              azureSubscription: 'azure-sp-terraform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd $(TF_WORKING_DIR)
                terraform init
                terraform plan \
                  -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
                  -out=tfplan

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    jobs:
      - deployment: Apply
        environment: 'prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: 'latest'

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: 'azure-sp-terraform'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      cd $(TF_WORKING_DIR)
                      terraform init
                      terraform import module.resource_group.azurerm_resource_group.this /subscriptions/68985c92-8674-44d4-a443-5945071e92a7/resourceGroups/ansible-tf-rg || true
                      terraform apply \
                        -auto-approve \
                        -var="ssh_public_key=$(SSH_PUBLIC_KEY)"