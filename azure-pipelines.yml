trigger:
  - main

parameters:
  - name: environment
    displayName: 'Terraform Environment'
    type: string
    default: dev
    values:
      - dev
      - prod

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_WORKING_DIR: 'environments/${{ parameters.environment }}'

steps:
  - checkout: self

  - script: |
      curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
      sudo apt-add-repository "deb https://apt.releases.hashicorp.com $(lsb_release -cs) main"
      sudo apt-get update
      sudo apt-get install -y terraform
      terraform version
    displayName: 'Install Terraform'

  - script: |
      terraform fmt -check -recursive
    displayName: 'Terraform Format Check'

  - task: AzureCLI@2
    displayName: 'Terraform Init'
    inputs:
      azureSubscription: 'azure-sp-terraform'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        cd $(TF_WORKING_DIR)
        terraform init

  - task: AzureCLI@2
    displayName: 'Terraform Validate'
    inputs:
      azureSubscription: 'azure-sp-terraform'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        cd $(TF_WORKING_DIR)
        terraform validate

  - task: AzureCLI@2
    displayName: 'Terraform Plan'
    inputs:
      azureSubscription: 'azure-sp-terraform'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        cd $(TF_WORKING_DIR)
        terraform plan \
          -var="ssh_public_key=$(SSH_PUBLIC_KEY)" \
          -out=tfplan